<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEI - Student Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #3b82f6;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

        body {
            background-color: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            font-size: 1.25rem;
            font-weight: 700;
            background: linear-gradient(135deg, #3b82f6, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .badge-role {
            background: rgba(59, 130, 246, 0.2);
            color: #60a5fa;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .logout-btn {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.875rem;
        }

        main {
            flex: 1;
            padding: 2rem;
            max-width: 1000px;
            margin: 0 auto;
            width: 100%;
        }

        .profile-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .profile-info h1 { font-size: 1.5rem; font-weight: 700; }
        .profile-info p { color: var(--text-secondary); margin-top: 0.25rem; font-size: 0.9rem; }

        .details-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .detail-box {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--border);
            padding: 1rem;
            border-radius: 12px;
        }

        .detail-label { font-size: 0.75rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; }
        .detail-val { font-size: 1.1rem; font-weight: 600; margin-top: 0.25rem; }
    </style>
</head>
<body>
    <header>
        <div class="brand">HEI &bull; Student Portal</div>
        <div style="display: flex; align-items: center; gap: 1rem;">
            <span class="badge-role">STUDENT</span>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
    </header>

    <main>
        <div class="profile-card">
            <div class="profile-info">
                <h1>Hello, <span th:text="${user != null ? user.firstname + ' ' + user.name : 'Student'}">Student</span></h1>
                <p th:text="${user != null ? user.email : 'hei.name@student.com'}">hei.name@student.com</p>
            </div>
        </div>

        <div class="details-grid">
            <div class="detail-box">
                <div class="detail-label">Student Reference</div>
                <div class="detail-val" th:text="${user != null ? user.ref : 'STD00000'}">STD00000</div>
            </div>
            <div class="detail-box">
                <div class="detail-label">Track</div>
                <div class="detail-val" th:text="${user != null && user.track != null ? user.track : 'Core Curriculum (EL/TN S4+)'}">Core Curriculum</div>
            </div>
            <div class="detail-box">
                <div class="detail-label">Cursus Status</div>
                <div class="detail-val" th:text="${user != null && user.cursusStatus != null ? user.cursusStatus : 'ACTIVE'}">ACTIVE</div>
            </div>
        </div>
    </main>

    <script>
        function logout() {
            document.cookie = 'jwt_token=; path=/; expires=Thu, 01 Jan 1970 00:00:01 GMT;';
            localStorage.clear();
            window.location.href = '/login';
        }
    </script>
</body>
</html>
