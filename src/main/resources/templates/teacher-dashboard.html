<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEI - Espace Enseignant</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #10b981;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

        body {
            background-color: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            font-size: 1.25rem;
            font-weight: 700;
            background: linear-gradient(135deg, #10b981, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .badge-role {
            background: rgba(16, 185, 129, 0.2);
            color: #34d399;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .logout-btn {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.875rem;
        }

        main {
            flex: 1;
            padding: 2rem;
            max-width: 1000px;
            margin: 0 auto;
            width: 100%;
        }

        .welcome-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.5rem;
        }
    </style>
</head>
<body>
    <header>
        <div class="brand">HEI &bull; Espace Enseignant</div>
        <div style="display: flex; align-items: center; gap: 1rem;">
            <span class="badge-role">ENSEIGNANT</span>
            <button class="logout-btn" onclick="logout()">Déconnexion</button>
        </div>
    </header>

    <main>
        <div class="welcome-card">
            <h1>Bienvenue, <span th:text="${user != null ? user.firstname + ' ' + user.name : 'Enseignant'}">Professeur</span></h1>
            <p style="color: var(--text-secondary); margin-top: 0.5rem;">Saisie et gestion des notes pour vos cours assignés.</p>
        </div>

        <div class="grid">
            <div class="card">
                <h3>📚 Mes Matières</h3>
                <p style="color: var(--text-secondary); margin-top: 0.5rem;">Consulter la liste de vos cours attribués pour l'année académique en cours.</p>
            </div>
            <div class="card">
                <h3>📝 Saisie des Notes</h3>
                <p style="color: var(--text-secondary); margin-top: 0.5rem;">Saisir et modifier les notes d'examens avec suivi d'historique.</p>
            </div>
        </div>
    </main>

    <script>
        function logout() {
            document.cookie = 'jwt_token=; path=/; expires=Thu, 01 Jan 1970 00:00:01 GMT;';
            localStorage.clear();
            window.location.href = '/login';
        }
    </script>
</body>
</html>
